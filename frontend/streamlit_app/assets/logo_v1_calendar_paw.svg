  <!-- paw: toes -->
  <circle cx="20" cy="34" r="3.6" fill="#FAFAFA"/>
  <circle cx="44" cy="34" r="3.6" fill="#FAFAFA"/>
  <circle cx="26" cy="29" r="3.2" fill="#FAFAFA"/>
